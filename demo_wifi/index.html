<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Portail d'authentification</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 32px;
      border-radius: 8px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
      border: 1px solid #cbd5e1;
      width: 100%;
      max-width: 360px;
    }
    h2 {
      margin-top: 0;
      color: #0f172a;
      font-size: 20px;
      text-align: center;
    }
    .warning {
      background-color: #fef3c7;
      border: 1px solid #fde68a;
      color: #92400e;
      padding: 10px;
      border-radius: 6px;
      font-size: 12.5px;
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.4;
    }
    label {
      font-size: 13.5px;
      color: #334155;
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
      color: #0f172a;
    }
    input:focus {
      outline: none;
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    button {
      width: 100%;
      padding: 11px;
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background-color: #0369a1;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Portail d'accès réseau</h2>
    <div class="warning">Démonstration pédagogique : canal de transmission non sécurisé (HTTP)</div>
    <form action="/login" method="POST">
      <label for="login">Identifiant :</label>
      <input type="text" id="login" name="login" required placeholder="ex: etudiant1">
      
      <label for="password">Mot de passe :</label>
      <input type="password" id="password" name="password" required placeholder="ex: demo1234">
      
      <button type="submit">Se connecter</button>
    </form>
  </div>
</body>
</html>
